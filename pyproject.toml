[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cornerstone-ca"
version = "0.1.0"
description = "Root CA whose signing key lives in AWS KMS (RSA-4096/SHA-256)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["pki", "x509", "certificate authority", "root ca", "aws kms"]
authors = [
  { name = "Ricardo Arguello" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Intended Audience :: System Administrators",
]
dependencies = [
  "boto3>=1.34",
  "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/daytwodev/cornerstone-ca"
Repository = "https://github.com/daytwodev/cornerstone-ca"
Issues = "https://github.com/daytwodev/cornerstone-ca/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cornerstone = "cornerstone.cli:main"

[tool.setuptools]
packages = ["cornerstone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
